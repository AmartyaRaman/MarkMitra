# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploy: push this repo to GitHub/GitLab, then in the Render dashboard
# choose New → Blueprint and select the repo. Render creates all three
# resources below and prompts for the values marked `sync: false`.
#
# All resources use the same region so the backend can reach Postgres over
# Render's private network.

databases:
  - name: markmitra-db
    databaseName: markmitra
    user: markmitra
    plan: free
    region: singapore

services:
  # ── Backend API (Docker) ─────────────────────────────────────
  - type: web
    name: markmitra-backend
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        fromDatabase:
          name: markmitra-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: markmitra-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: markmitra-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: markmitra-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: markmitra-db
          property: password
      - key: JWT_SECRET
        generateValue: true   # random 256-bit value, generated once by Render
      - key: JWT_EXPIRES_IN
        value: 7d
      # Prompted on first deploy:
      - key: ALLOWED_ORIGINS
        sync: false           # the frontend URL, e.g. https://markmitra.onrender.com
      - key: GEMINI_API_KEY
        sync: false           # leave as "your_gemini_api_key_here" for demo mode

  # ── Frontend (static site) ───────────────────────────────────
  - type: web
    name: markmitra
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION     # Vite 8 needs Node 20.19+
        value: "22"
    routes:
      # Replaces the nginx /api proxy used in Docker. If Render gives the
      # backend a different URL (e.g. a suffix because the name is taken),
      # update this destination to match.
      - type: rewrite
        source: /api/*
        destination: https://markmitra-backend.onrender.com/api/*
      # SPA fallback so refreshing /dashboard etc. works.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
