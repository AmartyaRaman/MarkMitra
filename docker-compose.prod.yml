# Production stack.
#
# Usage (from the repo root):
#   docker compose -f docker-compose.prod.yml --env-file backend/.env up -d --build
#
# `--env-file backend/.env` makes the ${...} values below come from the same
# file the backend reads, so the DB password is defined in exactly one place.
#
# Differences from docker-compose.yml (local dev):
#   - Postgres and the backend are NOT published on the host; only nginx (port 80) is.
#   - The DB password comes from backend/.env instead of being hard-coded.
#   - NODE_ENV=production, which makes the backend refuse to start with weak secrets.

name: markmitra

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in backend/.env}
      POSTGRES_DB: ${DB_NAME:-markmitra}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-markmitra}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - markmitra-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
    volumes:
      - uploads_data:/app/uploads
    # No `ports:` — only reachable from nginx inside the Docker network.
    networks:
      - markmitra-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-80}:80"
    networks:
      - markmitra-net

volumes:
  postgres_data:
  uploads_data:

networks:
  markmitra-net:
    driver: bridge
