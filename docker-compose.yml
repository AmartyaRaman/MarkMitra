version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: markmitra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: markmitra
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d markmitra"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - markmitra-net
      
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runner
    container_name: markmitra-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: markmitra
      DB_USER: postgres
      DB_PASSWORD: postgres123
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "5000:5000"
    networks:
      - markmitra-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
    container_name: markmitra-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - markmitra-net

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

networks:
  markmitra-net:
    driver: bridge
